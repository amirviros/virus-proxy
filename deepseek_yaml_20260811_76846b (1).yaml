name: 📥 Sync Worker from Cloudflare to GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Load configs from Cloudflare KV
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NS_ID: "11b68f79726c4ffca3be31f5144bc721"
        run: |
          echo "📥 دریافت تنظیمات از Cloudflare KV..."

          # دریافت توکن گیت‌هاب از KV
          GH_TOKEN=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/github_token" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")

          # دریافت نام مخزن از KV
          GH_REPO=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/github_repo" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")

          # دریافت نام ورکر از KV (اختیاری)
          CF_WORKER_NAME=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/worker_name" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          CF_WORKER_NAME=${CF_WORKER_NAME:-virus-proxy}

          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
          echo "GH_REPO=$GH_REPO" >> $GITHUB_ENV
          echo "CF_WORKER_NAME=$CF_WORKER_NAME" >> $GITHUB_ENV

      - name: 📥 Download worker code from Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ env.CF_WORKER_NAME }}
        run: |
          echo "📥 دانلود کد ورکر از Cloudflare..."
          curl -L -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/content" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o worker.js

          echo "✅ کد ورکر با موفقیت دانلود شد."

      - name: 📤 Commit & Push to GitHub
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GH_REPO: ${{ env.GH_REPO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add worker.js

          if git diff --staged --quiet; then
            echo "✅ تغییری در کد ورکر وجود ندارد."
          else
            echo "📤 ارسال تغییرات به گیت‌هاب..."
            git commit -m "🔄 همگام‌سازی خودکار worker.js از Cloudflare - $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git HEAD:main
            echo "✅ کد با موفقیت ارسال شد."
          fi