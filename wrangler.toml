name = "virus-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare KV namespace used for all persistent data (settings, users, sessions, logs).
# Create it first with:  npx wrangler kv namespace create VIRUS_PROXY_KV
# then paste the returned id below.
kv_namespaces = [
  { binding = "VIRUS_PROXY_KV", id = "YOUR_KV_ID" }
]

# Optional: sets the initial admin password on first run (before any password
# has been saved to KV). After the first login you should change it from the
# admin panel — from then on the KV-stored password takes precedence.
[vars]
ADMIN_PASS = "change-this-password"
